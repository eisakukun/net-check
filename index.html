<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>ネットの重さチェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07060d; --panel:#0d0b1a; --line:#2a1f4a;
    --txt:#e9f7ff; --sub:#7f86b3;
    --cyan:#00f0ff; --pink:#ff2bd6; --yellow:#fcee0a;
    --good:#00ff9c; --mid:#fcee0a; --bad:#ff3860;
    --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
    --disp:"Orbitron","Share Tech Mono",sans-serif;
    --jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0;font-family:var(--jp);color:var(--txt);min-height:100vh;
    background:
      radial-gradient(700px 420px at 50% -80px,#ff2bd633,transparent 70%),
      radial-gradient(600px 400px at 50% 110%,#00f0ff22,transparent 70%),
      var(--bg);
    display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
    padding:26px 16px calc(28px + env(safe-area-inset-bottom));
  }
  /* 走査線 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 3px);
  }
  /* 床のグリッド */
  .floor{
    position:fixed;left:-50%;right:-50%;bottom:-10vh;height:55vh;z-index:-1;pointer-events:none;
    background:
      linear-gradient(#ff2bd655 1px,transparent 1px) 0 0/60px 60px,
      linear-gradient(90deg,#ff2bd655 1px,transparent 1px) 0 0/60px 60px;
    transform:perspective(320px) rotateX(62deg);transform-origin:50% 100%;
    mask-image:linear-gradient(to top,#000 10%,transparent 85%);
    -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);
    animation:roll 3s linear infinite;
  }
  @keyframes roll{to{background-position:0 60px,0 0}}

  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}

  .tag{font-family:var(--mono);font-size:11px;color:var(--pink);letter-spacing:.25em;
    align-self:stretch;display:flex;justify-content:space-between;opacity:.85}
  .tag b{color:var(--cyan);font-weight:400}
  h1{
    font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:.08em;margin:10px 0 0;
    color:var(--txt);position:relative;text-shadow:0 0 12px #00f0ffaa;
  }
  h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;opacity:.7}
  h1::before{color:var(--pink);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:gl 4s infinite steps(1)}
  h1::after{color:var(--cyan);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl 4s infinite steps(1) reverse}
  @keyframes gl{0%,92%{transform:translate(0)}93%{transform:translate(-4px,1px)}95%{transform:translate(4px,-1px)}97%{transform:translate(-2px,0)}}
  .jp-title{font-size:15px;font-weight:700;letter-spacing:.2em;color:var(--yellow);margin:4px 0 2px;
    text-shadow:0 0 8px #fcee0a88}
  .lead{color:var(--sub);font-size:12px;margin:0 0 18px}

  /* ゲージ */
  .gauge-wrap{position:relative;width:280px;height:220px;margin:4px 0 0}
  svg{width:100%;height:100%;overflow:visible}
  .track{fill:none;stroke:#1b1533;stroke-width:14}
  .ticks{fill:none;stroke:#3a2d66;stroke-width:22;stroke-dasharray:2 10.2}
  .fill{fill:none;stroke:var(--cyan);stroke-width:14;
    filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor);
    transition:stroke-dashoffset .4s ease, stroke .4s ease, color .4s ease}
  .scale{font-family:var(--mono);font-size:10px;fill:var(--sub)}
  .big{position:absolute;left:0;right:0;top:92px;text-align:center}
  .big .num{font-family:var(--disp);font-size:58px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 10px var(--glow,#00f0ff),0 0 26px var(--glow,#00f0ff)}
  .big .unit{font-family:var(--mono);font-size:13px;color:var(--cyan);margin-top:6px;letter-spacing:.2em}
  .big .unit small{display:block;color:var(--sub);font-family:var(--jp);letter-spacing:.05em;font-size:11px;margin-top:2px}

  .verdict{font-size:15px;font-weight:700;margin:6px 0 18px;min-height:22px;text-align:center}

  /* ボタン */
  button{
    appearance:none;border:0;cursor:pointer;position:relative;
    font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.18em;
    padding:17px 44px;color:#07060d;background:var(--yellow);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    box-shadow:0 0 0 2px var(--yellow);transition:transform .1s, filter .2s;
  }
  button span{display:block;font-family:var(--jp);font-size:11px;letter-spacing:.1em;margin-top:3px;font-weight:700}
  button:hover{filter:brightness(1.1) drop-shadow(0 0 10px #fcee0a)}
  button:active{transform:scale(.97)}
  button:disabled{background:#3b3570;color:#aeb3e0;cursor:default;filter:none}
  button:disabled::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,#ffffff33,transparent);
    animation:sweep 1.1s linear infinite;
  }
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

  .stage{font-family:var(--mono);color:var(--cyan);font-size:12px;min-height:16px;margin-top:12px;letter-spacing:.05em}
  .stage::before{content:"> ";color:var(--pink)}
  .stage:empty::before{content:""}
  .cursor{display:inline-block;width:7px;height:12px;background:var(--cyan);vertical-align:-1px;margin-left:3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* カード */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:24px}
  .card{
    position:relative;background:linear-gradient(180deg,#120e25,#0a0816);padding:14px 8px 12px;text-align:center;
    border:1px solid var(--line);
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
  }
  .card::before{content:"";position:absolute;left:0;top:0;width:28px;height:2px;background:var(--c,var(--cyan));box-shadow:0 0 8px var(--c,var(--cyan))}
  .card .code{font-family:var(--mono);font-size:10px;color:var(--c,var(--cyan));letter-spacing:.2em}
  .card .k{color:var(--sub);font-size:11px;margin:3px 0 8px}
  .card .v{font-family:var(--disp);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;
    text-shadow:0 0 8px var(--c,var(--cyan))}
  .card .u{font-family:var(--mono);color:var(--sub);font-size:10px;margin-top:4px}
  .card.p{--c:var(--cyan)} .card.j{--c:var(--pink)} .card.s{--c:var(--yellow)}

  .note{color:var(--sub);font-size:11px;margin-top:22px;text-align:center;max-width:360px;line-height:1.7}
  .note code{font-family:var(--mono);color:var(--pink)}

  @media (max-width:360px){
    h1{font-size:25px}
    .gauge-wrap{width:250px;height:198px}
    .big{top:80px}.big .num{font-size:50px}
  }
</style>
</head>
<body>
  <div class="floor"></div>
  <div class="wrap">
    <div class="tag"><span>// NET_SCAN v2</span><span><b id="clock">--:--:--</b></span></div>
    <h1 data-t="NET CHECK">NET CHECK</h1>
    <div class="jp-title">ネットの重さチェッカー</div>
    <p class="lead">今つないでるネットの速さと重さを測るよ</p>

    <div class="gauge-wrap">
      <svg viewBox="0 0 280 220">
        <path class="ticks" d="M 40 190 A 100 100 0 1 1 240 190"/>
        <path class="track" d="M 40 190 A 100 100 0 1 1 240 190"/>
        <path class="fill" id="fill" d="M 40 190 A 100 100 0 1 1 240 190"/>
        <text class="scale" x="30" y="212">0</text>
        <text class="scale" x="232" y="212">200+</text>
      </svg>
      <div class="big">
        <div class="num" id="num">--</div>
        <div class="unit">Mbps<small>ダウンロード速度</small></div>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>

    <button id="go" onclick="run()">START SCAN<span>測定スタート</span></button>
    <div class="stage" id="stage"></div>

    <div class="cards">
      <div class="card p"><div class="code">PING</div><div class="k">応答の速さ</div><div class="v" id="ping">--</div><div class="u">ms</div></div>
      <div class="card j"><div class="code">JITTER</div><div class="k">ゆらぎ</div><div class="v" id="jitter">--</div><div class="u">ms</div></div>
      <div class="card s"><div class="code">STABLE</div><div class="k">安定度</div><div class="v" id="stable">--</div><div class="u">/ 100</div></div>
    </div>

    <p class="note">Cloudflareの計測サーバー <code>speed.cloudflare.com</code> と少しデータをやりとりして測っています。個人情報は送りません。数値は目安です。</p>
  </div>

<script>
const GMAX = 200;     // ゲージ上限 200Mbps
const fill = document.getElementById('fill');
const ARC_LEN = fill.getTotalLength();
fill.style.strokeDasharray = ARC_LEN;
fill.style.strokeDashoffset = ARC_LEN;

const tick = () => document.getElementById('clock').textContent = new Date().toLocaleTimeString('ja-JP',{hour12:false});
tick(); setInterval(tick, 1000);

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function setGauge(mbps){
  const r = Math.min(mbps / GMAX, 1);
  fill.style.strokeDashoffset = ARC_LEN * (1 - r);
  let c = cssVar('--cyan');
  if(mbps < 10) c = cssVar('--bad');
  else if(mbps < 30) c = cssVar('--mid');
  else if(mbps >= 80) c = cssVar('--good');
  fill.style.stroke = c; fill.style.color = c;
  document.getElementById('num').style.setProperty('--glow', c);
}

function verdictText(mbps){
  if(mbps < 3)  return ['🐢 かなり重い（ページも開きにくい）', 'var(--bad)'];
  if(mbps < 10) return ['😵 重い（動画がカクつくかも）', 'var(--bad)'];
  if(mbps < 30) return ['🙂 ふつう（普段使いはOK）', 'var(--mid)'];
  if(mbps < 80) return ['😀 速い（動画も快適）', 'var(--cyan)'];
  return ['🚀 とても速い（何でも快適）', 'var(--good)'];
}

function setStage(t, busy){
  const s = document.getElementById('stage');
  s.textContent = t;
  if(busy){ const c = document.createElement('span'); c.className = 'cursor'; s.appendChild(c); }
}

// ---- ping / jitter ----
async function measurePing(n=6){
  const times = [];
  for(let i=0;i<n;i++){
    const t = performance.now();
    try{
      await fetch('https://speed.cloudflare.com/__down?bytes=0&r='+Math.random(), {cache:'no-store'});
      times.push(performance.now() - t);
    }catch(e){}
  }
  if(!times.length) return null;
  // ゆらぎは測った順の差で見る（並べ替える前に計算）
  let jit = 0;
  for(let i=1;i<times.length;i++) jit += Math.abs(times[i]-times[i-1]);
  jit = times.length>1 ? jit/(times.length-1) : 0;
  const sorted = [...times].sort((a,b)=>a-b);
  const ping = sorted[Math.floor(sorted.length/2)]; // 中央値
  return {ping, jitter:jit};
}

// ---- download ----
async function measureDownload(bytes=25000000){
  const t = performance.now();
  const res = await fetch('https://speed.cloudflare.com/__down?bytes='+bytes+'&r='+Math.random(), {cache:'no-store'});
  const reader = res.body.getReader();
  let total = 0;
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    total += value.length;
    const sec = (performance.now() - t)/1000;
    if(sec>0){
      const mbps = (total*8)/sec/1e6;
      document.getElementById('num').textContent = mbps.toFixed(1);
      setGauge(mbps);
    }
  }
  const sec = (performance.now() - t)/1000;
  return (total*8)/sec/1e6;
}

async function run(){
  const btn = document.getElementById('go');
  btn.disabled = true;
  document.getElementById('verdict').textContent = '';
  document.getElementById('num').textContent = '0.0';
  setGauge(0);

  try{
    setStage('PING 応答の速さを測っています', true);
    const p = await measurePing();
    if(p){
      document.getElementById('ping').textContent = Math.round(p.ping);
      document.getElementById('jitter').textContent = Math.round(p.jitter);
      const score = Math.max(0, Math.min(100, Math.round(100 - p.jitter*2 - Math.max(0,p.ping-30)*0.3)));
      document.getElementById('stable').textContent = score;
    }

    setStage('DOWNLOAD ダウンロード速度を測っています', true);
    const mbps = await measureDownload();
    document.getElementById('num').textContent = mbps.toFixed(1);
    setGauge(mbps);
    const [txt,col] = verdictText(mbps);
    const v = document.getElementById('verdict');
    v.textContent = txt; v.style.color = col;
    setStage('SCAN COMPLETE 完了');
  }catch(e){
    setStage('ERROR 測定できませんでした（ネット未接続かも）');
  }finally{
    btn.disabled = false;
    btn.innerHTML = 'RESCAN<span>もう一回測る</span>';
  }
}
</script>
</body>
</html>
